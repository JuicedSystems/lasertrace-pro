<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="LaserTrace Pro: Paste a messy logo. Get a DXF that EZCAD fills cleanly.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16181d"/><stop offset="1" stop-color="#1f232b"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="c"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="6" fill="#ff8a1f"/>
  <!-- mark: a traced ring with node handles and a laser spark -->
  <g transform="translate(150 150)">
    <circle r="72" fill="none" stroke="#ff8a1f" stroke-width="2" stroke-opacity="0.35"/>
    <circle r="54" fill="none" stroke="#f2f2f2" stroke-width="22"/>
    <circle r="54" fill="none" stroke="#ff8a1f" stroke-width="2" stroke-dasharray="4 6"/>
    <g fill="#16181d" stroke="#ff8a1f" stroke-width="2.5">
      <rect x="-5" y="-59" width="10" height="10"/><rect x="49" y="-5" width="10" height="10"/>
      <rect x="-5" y="49" width="10" height="10"/><rect x="-59" y="-5" width="10" height="10"/>
    </g>
    <circle cx="51" cy="-51" r="7" fill="#ffd2a1"/><circle cx="51" cy="-51" r="14" fill="#ff8a1f" fill-opacity="0.25"/>
  </g>
  <text x="270" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#f5f5f5">LaserTrace Pro</text>
  <text x="272" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#b9bec8">Paste a messy logo. Get a DXF that EZCAD fills cleanly.</text>
  <text x="272" y="238" font-family="Consolas, Menlo, monospace" font-size="18" fill="#ff8a1f">DXF · SVG · PLT · PDF · PNG   |   outline · centerline · hybrid · 3D depth</text>
  </g>
</svg>
