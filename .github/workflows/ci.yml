name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 wheels need the X/EGL runtime that the GitHub runner image omits
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ui.txt

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  wheel:
    name: wheel installs and works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: The wheel must carry its data files
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          presets = [n for n in names if "preset_data/" in n and n.endswith(".json")]
          icons   = [n for n in names if "assets/" in n]
          print(f"{whl}: {len(presets)} presets, {len(icons)} icons")
          assert len(presets) >= 12, f"presets missing from the wheel: {presets}"
          assert icons, "UI assets missing from the wheel"
          assert not [n for n in names if "sidecar" in n], "GPL sidecar must not ship in the MIT wheel"
          PY

      # installed somewhere else entirely, and run from outside the source tree,
      # so a path that only resolves in a checkout cannot pass by accident
      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/probe
          /tmp/probe/bin/pip install --upgrade pip
          /tmp/probe/bin/pip install dist/*.whl

      - name: Verify the install
        working-directory: /tmp
        run: /tmp/probe/bin/python "$GITHUB_WORKSPACE/tools/verify_install.py"

      - name: Console scripts work
        working-directory: /tmp
        run: |
          /tmp/probe/bin/lasertrace --list-presets
          /tmp/probe/bin/lasertrace "$GITHUB_WORKSPACE/fixtures/logo_geometric_sharp.png" \
            --width-mm 38 --out /tmp/out.dxf --stats /tmp/out.json
          test -s /tmp/out.dxf

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
