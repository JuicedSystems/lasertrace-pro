name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      draft_release:
        description: "Also create a draft GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact: LaserTracePro-windows-x64
          - os: macos-14
            label: macOS Apple Silicon
            artifact: LaserTracePro-macos-arm64
          # No Intel macOS target: the `macos-13` runner image is retired, and a
          # job asking for it sits queued forever rather than failing, which is
          # worse than not building it. Intel Mac users install from source
          # (an arm64 build cannot run on Intel - Rosetta only goes x86 -> ARM).
          # If a working Intel image appears, add it back here with
          # artifact: LaserTracePro-macos-x64 and the release notes follow.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ui.txt
          pip install pyinstaller>=6.10

      # macOS wants a real .icns; iconutil ships with the OS
      - name: Build icon (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ICONSET=packaging/icon.iconset
          mkdir -p "$ICONSET"
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src = Image.open("lasertrace_ui/assets/icon.png").convert("RGBA")
          out = Path("packaging/icon.iconset")
          for size in (16, 32, 128, 256, 512):
              src.resize((size, size), Image.LANCZOS).save(out / f"icon_{size}x{size}.png")
              src.resize((size * 2, size * 2), Image.LANCZOS).save(out / f"icon_{size}x{size}@2x.png")
          PY
          iconutil -c icns "$ICONSET" -o packaging/icon.icns
          ls -la packaging/icon.icns

      - name: Build
        run: pyinstaller packaging/lasertrace.spec --noconfirm

      - name: Verify the bundle
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            python tools/verify_bundle.py "dist/LaserTrace Pro.app"
          else
            python tools/verify_bundle.py "dist/LaserTracePro"
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE, NOTICE, README.md dist/LaserTracePro/
          Compress-Archive -Path dist/LaserTracePro -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # ad-hoc sign so the bundle at least has a valid (unnotarised) signature;
          # without this an arm64 .app is killed on launch rather than merely warned about
          codesign --force --deep --sign - "dist/LaserTrace Pro.app"
          codesign --verify --verbose "dist/LaserTrace Pro.app" || true
          ditto -c -k --sequesterRsrc --keepParent "dist/LaserTrace Pro.app" "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    # `always()` on purpose: one stuck or failed target must not hold the
    # finished ones hostage - we publish whatever built, and the step below
    # names the platforms from the artifacts that actually exist, so a release
    # can never advertise a download it does not contain. (This is how the
    # retired Intel macOS runner blocked v0.1.0 the first time.)
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.draft_release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Which platforms made it
        id: built
        run: |
          set -euo pipefail
          ls -la artifacts
          test -n "$(ls -A artifacts 2>/dev/null)" || { echo "no artifacts at all - nothing to release"; exit 1; }
          {
            echo "table<<EOF"
            for f in artifacts/*.zip; do
              base=$(basename "$f")
              case "$base" in
                *windows-x64*) what="Windows 10/11 (64-bit) — unzip anywhere, run \`LaserTracePro.exe\`" ;;
                *macos-arm64*) what="macOS on Apple Silicon (M1 and later)" ;;
                *macos-x64*)   what="macOS on Intel" ;;
                *)             what="" ;;
              esac
              echo "| \`$base\` | $what |"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            Standalone builds — no Python install required.

            | Download | For |
            |---|---|
            ${{ steps.built.outputs.table }}

            **These builds are unsigned.** They are not code-signed by a paid
            Apple/Microsoft developer certificate, so the OS will warn you:

            - **Windows** — SmartScreen says "Windows protected your PC":
              *More info* → *Run anyway*.
            - **macOS** — "cannot be opened because the developer cannot be
              verified": right-click the app → *Open* → *Open*, or
              *System Settings → Privacy & Security → Open Anyway*.

            Prefer to skip that entirely? Install from source instead:

            ```
            pip install "lasertrace[ui] @ git+https://github.com/JuicedSystems/lasertrace-pro.git"
            ```
